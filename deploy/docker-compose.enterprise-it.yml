# PC #4 — Enterprise IT & Analytics (Purdue L4) · citadel-it · 192.168.1.244 (corp) + 10.10.0.30 (OT, L3.5 boundary)
# Runner labels: [self-hosted, windows, enterprise-it] — the ONLY runner; also deploys PC #2/#3 (docs/network.md §6).
# Run manually: docker compose -f deploy/docker-compose.enterprise-it.yml --env-file deploy/.env up -d --build
name: citadel-enterprise-it

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12  # US-206 digest pin
    container_name: it-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citadel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-citadel}
    ports:
      - "5432:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:11.3.0@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3  # US-206 digest pin
    container_name: it-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy

  # --- Sprint 3: MQTT -> TimescaleDB ingestion worker ---
  # it-ingestion:
  #   build: ../it-ingestion
  #   container_name: it-ingestion
  #   restart: unless-stopped
  #   environment:
  #     MQTT_HOST: ${CONTROL_ROOM_HOST}   # PC #3 10.10.0.20, reached via NIC 2 across L3.5
  #     MQTT_PORT: "1883"
  #     PGHOST: timescaledb
  #     PGUSER: ${POSTGRES_USER:-citadel}
  #     PGPASSWORD: ${POSTGRES_PASSWORD}
  #     PGDATABASE: ${POSTGRES_DB:-citadel}
  #   depends_on:
  #     timescaledb:
  #       condition: service_healthy

volumes:
  tsdb-data:
  grafana-data:
