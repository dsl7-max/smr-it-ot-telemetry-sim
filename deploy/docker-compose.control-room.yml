# PC #3 — Citadel Control Room (Purdue L2–3). Runner labels: [self-hosted, windows, control-room]
# Run manually: docker compose -f deploy/docker-compose.control-room.yml up -d --build
# FactoryTalk Optix HMI runs natively on Windows on this PC (not containerized).
name: citadel-control-room

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: cr-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT — the ONLY port allowed across the L3.5 firewall (PC #4 subscribes)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Sprint 2–3: OT gateway (polls PC #2 Modbus/OPC UA, publishes to MQTT) ---
  # ot-gateway:
  #   build: ../ot-gateway
  #   container_name: cr-ot-gateway
  #   restart: unless-stopped
  #   environment:
  #     PLANT_HOST: ${PLANT_HOST}       # PC #2 static IP
  #     MODBUS_PORT: "502"
  #     OPCUA_ENDPOINT: opc.tcp://${PLANT_HOST}:4840
  #     MQTT_HOST: mosquitto
  #   depends_on:
  #     - mosquitto

volumes:
  mosquitto-data:
