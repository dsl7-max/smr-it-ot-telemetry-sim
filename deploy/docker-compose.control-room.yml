# PC #3 — Citadel Control Room (Purdue L2–3) · citadel-hmi · 10.10.0.20 · AIR-GAPPED
# Deployed remotely from the PC #4 jump-host (DOCKER_HOST=ssh://citadel-hmi) — see docs/network.md §6.
# Air gap: images must be self-contained and pre-loaded (no pulls).
# TODO(US-406): bake mosquitto.conf into a custom image — the bind mount below resolves on the REMOTE host.
# FactoryTalk Optix HMI runs natively on Windows on this PC (not containerized).
name: citadel-control-room

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20@sha256:21421af7b32bf9ce508e9090c8eb13bb81f410ca778dc205506180a6f862d0eb  # US-206 digest pin
    container_name: cr-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT — the L3.5 data conduit (PC #4 10.10.0.30 subscribes)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Sprint 2–3: OT gateway (polls PC #2 Modbus/OPC UA, publishes to MQTT) ---
  # ot-gateway:
  #   build: ../ot-gateway
  #   container_name: cr-ot-gateway
  #   restart: unless-stopped
  #   environment:
  #     PLANT_HOST: ${PLANT_HOST}       # PC #2 static IP
  #     MODBUS_PORT: "502"
  #     OPCUA_ENDPOINT: opc.tcp://${PLANT_HOST}:4840
  #     MQTT_HOST: mosquitto
  #   depends_on:
  #     - mosquitto

volumes:
  mosquitto-data:
